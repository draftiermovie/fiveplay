# Builds the game for every platform on each push (and pull request), and
# uploads the results as workflow artifacts:
#   Windows: FivePlay.exe (single file) and FivePlay.msi (installer)
#   Linux:   FivePlay-x86_64.AppImage and a .deb package
#   macOS:   FivePlay-macOS.dmg (universal: Apple silicon and Intel)
#
# Optional repository variable FIVEPLAY_SERVER (Settings > Secrets and
# variables > Actions > Variables) pre-fills PLAY ONLINE's server address.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FIVEPLAY_DEFAULT_SERVER: ${{ vars.FIVEPLAY_SERVER }}

jobs:
  windows:
    name: Windows (.exe, .msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          # Static C runtime and no console window, as tools/build-exe.ps1.
          RUSTFLAGS: -C target-feature=+crt-static --cfg fiveplay_dist
        run: cargo build --release --locked
      - name: Installer version
        id: version
        shell: bash
        # MSI versions are numeric: Cargo's major.minor plus the run number,
        # so every build can upgrade the previous one.
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\)\.\([0-9]*\)\..*"/\1.\2/p' Cargo.toml | head -n1)
          echo "msi=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Package
        run: |
          dotnet tool install --global wix --version 5.0.2
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/fiveplay.exe dist/FivePlay.exe
          wix build packaging/windows/fiveplay.wxs -arch x64 `
            -d Version=${{ steps.version.outputs.msi }} `
            -d ExePath=dist/FivePlay.exe `
            -o dist/FivePlay.msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: FivePlay-windows
          path: |
            dist/FivePlay.exe
            dist/FivePlay.msi
          if-no-files-found: error

  linux:
    name: Linux (AppImage, .deb)
    # The oldest supported runner, so the binaries run on older distributions
    # too (they need at least its glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Build
        run: cargo build --release --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Debian package
        run: |
          mkdir -p dist
          cargo deb --no-build --output dist/
      - name: AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/fiveplay AppDir/usr/bin/
          cp packaging/linux/fiveplay.desktop AppDir/
          cp packaging/icon.png AppDir/fiveplay.png
          ln -s usr/bin/fiveplay AppDir/AppRun
          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # Runners have no FUSE; the tool unpacks itself instead.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/FivePlay-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: FivePlay-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: App bundle and disk image
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          app=dist/dmg/FivePlay.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          # One binary for Apple silicon and Intel Macs.
          lipo -create -output "$app/Contents/MacOS/fiveplay" \
            target/aarch64-apple-darwin/release/fiveplay \
            target/x86_64-apple-darwin/release/fiveplay
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=FivePlay.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
          done
          for size in 16 128 256; do
            double=$((size * 2))
            sips -z $double $double packaging/icon.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns -o "$app/Contents/Resources/FivePlay.icns" "$iconset"
          # Ad-hoc signature: required to run on Apple silicon. Not notarized,
          # so the first launch needs right-click > Open.
          codesign --force --deep --sign - "$app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname FivePlay -srcfolder dist/dmg -ov -format UDZO dist/FivePlay-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: FivePlay-macos
          path: dist/FivePlay-macOS.dmg
          if-no-files-found: error
