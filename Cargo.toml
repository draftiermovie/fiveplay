[package]
name = "fiveplay"
version = "0.5.0"
edition = "2024"
description = "Arena shooter against bots or other players online"

# Debian package (cargo deb), built by .github/workflows/build.yml.
[package.metadata.deb]
maintainer = "FivePlay developers"
section = "games"
extended-description = "A fast arena shooter: Free For All, Team Deathmatch, Capture the Flag, King of the Hill, Gun Game and Kill Confirmed against bots, or online on a dedicated server. All game data is inside the program."
depends = "$auto"
assets = [
    ["target/release/fiveplay", "usr/bin/fiveplay", "755"],
    ["packaging/linux/fiveplay.desktop", "usr/share/applications/fiveplay.desktop", "644"],
    ["packaging/icon.png", "usr/share/icons/hicolor/512x512/apps/fiveplay.png", "644"],
]

[dependencies]
bevy = { version = "0.20.1", features = ["wav"] }
avian3d = "0.8.0"
fiveplay-net = { path = "net" }
# Only for the window icon type; the same version Bevy uses.
winit = { version = "0.30", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "sync", "macros", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fiveplay_dist)'] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Smaller standalone exe (tools/build-exe.ps1); symbols are not needed by players.
strip = true

[build-dependencies]
# Puts the icon and version details into FivePlay.exe (Windows builds only).
winresource = { version = "0.1", default-features = false }
