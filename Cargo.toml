[package]
name = "fiveplay"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["wav"] }
avian3d = "0.8.0"
fiveplay-net = { path = "net" }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "sync", "macros", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fiveplay_dist)'] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Smaller standalone exe (tools/build-exe.ps1); symbols are not needed by players.
strip = true
